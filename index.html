<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELD JEACHAT</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبات Firebase Compat الضرورية -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="screen">
        <div class="login-card">
            <h2>مرحباً بك في ELD JEACHAT</h2>
            <p>سجل دخولك لبدء المحادثات الخاصة</p>
            <button id="google-login-btn" class="btn">تسجيل الدخول باستخدام Google</button>
        </div>
    </div>

    <!-- نافذة ادخال اسم المستخدم عند لأول مرة -->
    <div id="username-modal" class="modal hidden">
        <div class="modal-content">
            <h3>اختر اسم مستخدم خاص بك</h3>
            <input type="text" id="username-input" placeholder="اسم المستخدم (بالإنجليزي)...">
            <button id="save-username-btn" class="btn">حفظ ومتابعة</button>
        </div>
    </div>

    <!-- شاشة التطبيق الرئيسية -->
    <div id="app-screen" class="screen hidden">
        <!-- الشريط الجانبي للمحادثات -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div id="my-avatar" class="avatar">G</div>
                    <span id="my-username">المستخدم</span>
                </div>
                <div class="header-actions">
                    <button id="logout-btn" title="تسجيل الخروج">🚪</button>
                </div>
            </div>

            <!-- مربع البحث عن اسم المستخدم -->
            <div class="search-box">
                <input type="text" id="user-search-input" placeholder="بحث باسم المستخدم...">
            </div>

            <!-- قائمة المستخدمين والدردشات -->
            <div id="chats-list" class="chats-list">
                <div class="empty-list-notice">ابحث عن اسم مستخدم لبدء محادثة خاصة</div>
            </div>
        </div>

        <!-- منطقة الدردشة النشطة -->
        <div class="chat-area">
            <!-- الهيدر الخاص بالدردشة -->
            <div id="chat-header" class="chat-header hidden">
                <div id="active-chat-avatar" class="avatar">U</div>
                <div class="chat-header-info">
                    <h3 id="active-chat-username">اسم المستخدم</h3>
                    <span id="active-user-status" style="font-size: 12px; color: #888;">جاري التحميل...</span>
                </div>
            </div>

            <!-- الرسالة الترحيبية عند عدم اختيار محادثة -->
            <div id="no-chat-selected" class="no-chat">
                <h3>مرحباً بك في المحادثات الخاصة</h3>
                <p>اختر مستخدماً من القائمة للبدء في المراسلة</p>
            </div>

            <!-- صندوق الرسائل -->
            <div id="chat-box" class="chat-box hidden"></div>

            <!-- منطقة إدخال الرسالة -->
            <div id="chat-input-area" class="chat-input-area hidden">
                <input type="text" id="message-input" placeholder="اكتب رسالة...">
                <button id="send-btn" class="btn-send">إرسال</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
